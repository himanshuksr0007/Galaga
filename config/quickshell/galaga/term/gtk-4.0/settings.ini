[Settings]
# window buttons: close and maximise, on the left. Maximise is rendered AND
# works: the click sends a maximise request, and the rice's rules exempt these
# apps from the global maximise suppression (hypr/hyprland/rules.lua), so
# Hyprland honours it. Minimise is NOT rendered: a window's own minimise
# request is dropped inside Hyprland (there is no minimised state for it to go
# to), so a painted disc would lie about what its click does. Minimise for
# these apps lives on the keyboard: Super+Alt+M parks the window,
# Super+Alt+F maximises, Super+F fullscreens. The app menu stays right. The
# discs are painted in gtk.css next to this file.
gtk-decoration-layout=close,maximize:appmenu
