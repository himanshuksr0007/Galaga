[Settings]
# window buttons: ONLY close, on the left. Minimise/maximise are not rendered in
# GTK headerbars at all -- their clicks send requests Hyprland cannot honour
# (there is no minimise path for client requests, and maximise requests are
# suppressed by the rice's own global rule), so showing painted-but-dead discs
# would be decoration lying about function. Minimise/maximise for these apps
# live on the keyboard: Super+Alt+M parks the window, Super+Alt+F maximises,
# Super+F fullscreens. The app menu stays right. The close disc is painted in
# gtk.css next to this file.
gtk-decoration-layout=close:appmenu
