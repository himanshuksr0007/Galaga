# glyph -- libinput-gestures carries exactly ONE gesture: the 4-finger tap that
# opens quick settings (hypr/hyprland/gestures.lua has the full map). Hyprland's
# native engine has no tap or hold shape, and neither does libinput -- but a
# short, stationary 4-finger touch registers as a hold, and a hold with no
# added delay runs its command on release: a tap, in effect. Movement cancels
# a hold inside libinput itself, so this can never fire mid-swipe -- the
# native 4-finger swipe up (the desktops overview) is a movement, never a
# hold, so the two never collide. Everything else stays native -- if this file
# ever grows swipe lines, they would fight the compositor's own tracking.
# libinput-gestures only reads the pad (via libinput debug-events); it does
# not grab the device, so the native gestures are unaffected. It needs the
# user in the input group -- install.sh's services() already adds it (for
# ydotool), and execs.lua starts the daemon with the session.
gesture hold on 4 hyprctl dispatch "global shell:quick"
