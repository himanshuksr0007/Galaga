# glyph system eq: a pipewire filter-chain sink (three biquads -- low shelf,
# peaking, high shelf) that the shell drops in front of an output device when
# that device's eq is on (services/Eq.qml). The chain is parked until the
# shell points glyph-eq-feed at a device and makes glyph-eq the default sink;
# with eq off everywhere it sits in the graph unused and costs nothing.
# Gains are live controls: pw-cli set-param on the node's Props
# ("lo:Gain", "mid:Gain", "hi:Gain", decibels) -- no restart, no relink.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      filter.graph = {
        nodes = [
          { type = builtin, name = lo,  label = bq_lowshelf,  control = { "Freq" = 100.0,  "Gain" = 0.0, "Q" = 0.7 } }
          { type = builtin, name = mid, label = bq_peaking,   control = { "Freq" = 1000.0, "Gain" = 0.0, "Q" = 1.0 } }
          { type = builtin, name = hi,  label = bq_highshelf, control = { "Freq" = 8000.0, "Gain" = 0.0, "Q" = 0.7 } }
        ]
        links = [ { output = "lo:Out", input = "mid:In" } { output = "mid:Out", input = "hi:In" } ]
        inputs = [ "lo:In" ]
        outputs = [ "hi:Out" ]
      }
      capture.props = { node.name = "glyph-eq", node.description = "Glyph EQ", media.class = "Audio/Sink", audio.channels = 2, audio.position = [ FL, FR ] }
      playback.props = { node.name = "glyph-eq-feed", media.class = "Audio/Source", audio.channels = 2, audio.position = [ FL, FR ] }
    }
  }
]
